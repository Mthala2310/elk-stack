input {
  redis {
    host => "redis"
    port => 6379
    data_type => "list"
    key => "logs"
  }
}

filter {
  # 1. Parsing baris log ke field-field terstruktur
  grok {
    match => {
      "message" => [
        # Pola A: Baris Metrik Performa (Start / End dengan durasi ms)
        "^(?<log_level>[A-Z]+)\s+(?<log_timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2},\d{3})\s+%{DATA:caller_class}\(%{DATA:caller_method}:%{INT:caller_line}\)\s+-\s+\[(?<trace_id>-?\d+)\]\[(?<service_name>[^\]\->]+)(?:\s+Ver\.\s+(?<service_version>\d+))?(?:->(?<step_name>[^\]]+))?\](?<perf_action>Start|End)\s+\[(?<duration_ms>-?\d+)\s+ms\]",

        # Pola B: Baris Parameter Input Bisnis
        "^(?<log_level>[A-Z]+)\s+(?<log_timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2},\d{3})\s+%{DATA:caller_class}\(%{DATA:caller_method}:%{INT:caller_line}\)\s+-\s+\[(?<trace_id>-?\d+)\]\[(?<service_name>[^\]\->]+)(?:\s+Ver\.\s+(?<service_version>\d+))?\]Input Variable Name:\s+%{WORD:variable_name}(?:\s*->\s*(?<variable_value>.*))?",

        # Pola C: Baris Internal Trace / Nested Span pembuka (yang berakhiran ->)
        "^(?<log_level>[A-Z]+)\s+(?<log_timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2},\d{3})\s+%{DATA:caller_class}\(%{DATA:caller_method}:%{INT:caller_line}\)\s+-\s+\[(?<trace_id>-?\d+)\]\[(?<service_name>[^\]\->]+)(?:\s+Ver\.\s+(?<service_version>\d+))?(?:->(?<step_name>[^\]\->]+))?->\s*$",

        # Pola D: Fallback jika ada baris log umum lainnya
        "^(?<log_level>[A-Z]+)\s+(?<log_timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2},\d{3})\s+%{DATA:caller_class}\(%{DATA:caller_method}:%{INT:caller_line}\)\s+-\s+\[(?<trace_id>-?\d+)\]%{GREEDYDATA:log_payload}"
      ]
    }
  }

  # 2. Timpa @timestamp Elasticsearch dengan waktu asli dari log
  date {
    match => [ "log_timestamp", "yyyy-MM-dd HH:mm:ss,SSS" ]
    timezone => "Asia/Jakarta"
    target => "@timestamp"
    remove_field => [ "log_timestamp" ]
  }

  # 3. Konversi Tipe Data Numerik untuk Agregasi Kibana
  mutate {
    convert => {
      "duration_ms"     => "integer"
      "caller_line"     => "integer"
      "service_version" => "integer"
    }
    strip => [ "variable_value", "step_name", "service_name" ]
  }

  # 4. Filter Khusus Metrik Response Time (RT)
  if [perf_action] == "End" and [duration_ms] {
    mutate {
      add_field => { "is_execution_metric" => "true" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # Nama indeks otomatis mengikuti tanggal kejadian log (misal: app-logs-2026.10.19)
    index => "app-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}